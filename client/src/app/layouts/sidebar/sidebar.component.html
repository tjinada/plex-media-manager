<aside 
  class="h-screen bg-dark-900 border-r border-dark-700 flex flex-col transition-all duration-300"
  [class.w-64]="!isCollapsed"
  [class.w-16]="isCollapsed">
  
  <!-- Logo / Header -->
  <div class="h-16 flex items-center px-4 border-b border-dark-700">
    <div class="flex items-center gap-3 overflow-hidden">
      <!-- Logo Icon -->
      <div class="w-8 h-8 bg-primary-600 rounded-lg flex items-center justify-center flex-shrink-0">
        <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" 
                d="M7 4v16M17 4v16M3 8h4m10 0h4M3 12h18M3 16h4m10 0h4M4 20h16a1 1 0 001-1V5a1 1 0 00-1-1H4a1 1 0 00-1 1v14a1 1 0 001 1z" />
        </svg>
      </div>
      <span 
        class="font-semibold text-gray-100 whitespace-nowrap transition-opacity duration-300"
        [class.opacity-0]="isCollapsed"
        [class.opacity-100]="!isCollapsed">
        TJ Media
      </span>
    </div>
  </div>
  
  <!-- Navigation -->
  <nav class="flex-1 py-4 overflow-y-auto">
    <ul class="space-y-1 px-2">
      @for (item of navItems; track item.path) {
        <li>
          <a 
            [routerLink]="item.path"
            routerLinkActive="bg-dark-700 text-primary-400"
            [routerLinkActiveOptions]="{ exact: item.path === '/dashboard' }"
            class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-gray-400 hover:bg-dark-800 hover:text-gray-200 transition-colors"
            [class.justify-center]="isCollapsed"
            [title]="isCollapsed ? item.label : ''">
            
            <!-- Icons -->
            @switch (item.icon) {
              @case ('dashboard') {
                <svg class="w-5 h-5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" 
                        d="M4 5a1 1 0 011-1h14a1 1 0 011 1v2a1 1 0 01-1 1H5a1 1 0 01-1-1V5zM4 13a1 1 0 011-1h6a1 1 0 011 1v6a1 1 0 01-1 1H5a1 1 0 01-1-1v-6zM16 13a1 1 0 011-1h2a1 1 0 011 1v6a1 1 0 01-1 1h-2a1 1 0 01-1-1v-6z" />
                </svg>
              }
              @case ('movie') {
                <svg class="w-5 h-5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" 
                        d="M7 4v16M17 4v16M3 8h4m10 0h4M3 12h18M3 16h4m10 0h4M4 20h16a1 1 0 001-1V5a1 1 0 00-1-1H4a1 1 0 00-1 1v14a1 1 0 001 1z" />
                </svg>
              }
              @case ('tv') {
                <svg class="w-5 h-5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" 
                        d="M9.75 17L9 20l-1 1h8l-1-1-.75-3M3 13h18M5 17h14a2 2 0 002-2V5a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" />
                </svg>
              }
              @case ('settings') {
                <svg class="w-5 h-5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" 
                        d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" />
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                </svg>
              }
            }
            
            <span 
              class="whitespace-nowrap transition-opacity duration-300"
              [class.opacity-0]="isCollapsed"
              [class.hidden]="isCollapsed">
              {{ item.label }}
            </span>
          </a>
        </li>
      }
    </ul>
  </nav>
  
  <!-- Collapse Toggle -->
  <div class="p-2 border-t border-dark-700">
    <button 
      (click)="toggleCollapsed()"
      class="w-full flex items-center justify-center p-2 rounded-lg text-gray-400 hover:bg-dark-800 hover:text-gray-200 transition-colors"
      [title]="isCollapsed ? 'Expand sidebar' : 'Collapse sidebar'">
      <svg 
        class="w-5 h-5 transition-transform duration-300"
        [class.rotate-180]="isCollapsed"
        fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 19l-7-7 7-7m8 14l-7-7 7-7" />
      </svg>
    </button>
  </div>
</aside>
