<div class="min-h-screen bg-dark-950 flex items-center justify-center px-4">
  <div class="w-full max-w-sm">
    <!-- Logo / Title -->
    <div class="text-center mb-8">
      <div class="w-16 h-16 bg-primary-500/10 rounded-2xl flex items-center justify-center mx-auto mb-4">
        <svg class="w-8 h-8 text-primary-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 12h14M5 12a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v4a2 2 0 01-2 2M5 12a2 2 0 00-2 2v4a2 2 0 002 2h14a2 2 0 002-2v-4a2 2 0 00-2-2m-2-4h.01M17 16h.01"/>
        </svg>
      </div>
      <h1 class="text-[22px] font-bold text-white tracking-tight">TJ Plex Media Manager</h1>
      <p class="text-gray-500 text-[13px] mt-1">Sign in to continue</p>
    </div>

    <!-- Login Form -->
    <div class="rounded-2xl bg-white/[0.03] overflow-hidden">
      <div class="p-5 space-y-4">
        @if (error) {
          <div class="p-3 bg-red-500/[0.08] rounded-xl flex items-center gap-2">
            <svg class="w-4 h-4 text-red-400 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-2.5L13.732 4c-.77-.833-1.964-.833-2.732 0L4.082 16.5c-.77.833.192 2.5 1.732 2.5z"/>
            </svg>
            <span class="text-[13px] text-red-400">{{ error }}</span>
          </div>
        }

        <div>
          <label class="block text-[13px] font-semibold text-gray-300 mb-1.5">Username</label>
          <input
            type="text"
            [(ngModel)]="username"
            (keydown.enter)="onSubmit()"
            autocomplete="username"
            autofocus
            class="w-full bg-white/[0.04] border-0 text-gray-200 text-[14px] rounded-xl px-4 py-3 focus:ring-2 focus:ring-primary-500/50 focus:outline-none placeholder-gray-600"
            placeholder="Enter username">
        </div>

        <div>
          <label class="block text-[13px] font-semibold text-gray-300 mb-1.5">Password</label>
          <input
            type="password"
            [(ngModel)]="password"
            (keydown.enter)="onSubmit()"
            autocomplete="current-password"
            class="w-full bg-white/[0.04] border-0 text-gray-200 text-[14px] rounded-xl px-4 py-3 focus:ring-2 focus:ring-primary-500/50 focus:outline-none placeholder-gray-600"
            placeholder="Enter password">
        </div>

        <button
          (click)="onSubmit()"
          [disabled]="isLoading || !username || !password"
          class="w-full py-3 text-[14px] font-semibold bg-primary-600 active:bg-primary-700 text-white rounded-xl transition-colors disabled:opacity-40 flex items-center justify-center gap-2">
          @if (isLoading) {
            <svg class="animate-spin h-4 w-4" fill="none" viewBox="0 0 24 24">
              <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
              <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
            </svg>
            Signing in...
          } @else {
            Sign In
          }
        </button>
      </div>
    </div>
  </div>
</div>
