<div class="space-y-3">
  <!-- Labels showing current values -->
  <div class="flex justify-between text-sm text-gray-400">
    <span>{{ formatValue(currentMin) }}</span>
    <span>{{ formatValue(currentMax) }}</span>
  </div>

  <!-- Slider Track -->
  <div class="relative h-2">
    <!-- Background Track -->
    <div class="absolute w-full h-2 bg-dark-700 rounded-full"></div>
    
    <!-- Active Track -->
    <div 
      class="absolute h-2 bg-primary-600 rounded-full"
      [style.left.%]="leftPercent"
      [style.right.%]="100 - rightPercent">
    </div>

    <!-- Min Slider -->
    <input 
      type="range"
      [min]="min"
      [max]="max"
      [step]="step"
      [value]="currentMin"
      (input)="onMinChange($event)"
      class="absolute w-full h-2 appearance-none bg-transparent pointer-events-none
             [&::-webkit-slider-thumb]:pointer-events-auto
             [&::-webkit-slider-thumb]:appearance-none
             [&::-webkit-slider-thumb]:w-4
             [&::-webkit-slider-thumb]:h-4
             [&::-webkit-slider-thumb]:bg-primary-500
             [&::-webkit-slider-thumb]:rounded-full
             [&::-webkit-slider-thumb]:cursor-pointer
             [&::-webkit-slider-thumb]:border-2
             [&::-webkit-slider-thumb]:border-dark-900
             [&::-webkit-slider-thumb]:shadow-lg
             [&::-webkit-slider-thumb]:hover:bg-primary-400
             [&::-moz-range-thumb]:pointer-events-auto
             [&::-moz-range-thumb]:appearance-none
             [&::-moz-range-thumb]:w-4
             [&::-moz-range-thumb]:h-4
             [&::-moz-range-thumb]:bg-primary-500
             [&::-moz-range-thumb]:rounded-full
             [&::-moz-range-thumb]:cursor-pointer
             [&::-moz-range-thumb]:border-2
             [&::-moz-range-thumb]:border-dark-900">

    <!-- Max Slider -->
    <input 
      type="range"
      [min]="min"
      [max]="max"
      [step]="step"
      [value]="currentMax"
      (input)="onMaxChange($event)"
      class="absolute w-full h-2 appearance-none bg-transparent pointer-events-none
             [&::-webkit-slider-thumb]:pointer-events-auto
             [&::-webkit-slider-thumb]:appearance-none
             [&::-webkit-slider-thumb]:w-4
             [&::-webkit-slider-thumb]:h-4
             [&::-webkit-slider-thumb]:bg-primary-500
             [&::-webkit-slider-thumb]:rounded-full
             [&::-webkit-slider-thumb]:cursor-pointer
             [&::-webkit-slider-thumb]:border-2
             [&::-webkit-slider-thumb]:border-dark-900
             [&::-webkit-slider-thumb]:shadow-lg
             [&::-webkit-slider-thumb]:hover:bg-primary-400
             [&::-moz-range-thumb]:pointer-events-auto
             [&::-moz-range-thumb]:appearance-none
             [&::-moz-range-thumb]:w-4
             [&::-moz-range-thumb]:h-4
             [&::-moz-range-thumb]:bg-primary-500
             [&::-moz-range-thumb]:rounded-full
             [&::-moz-range-thumb]:cursor-pointer
             [&::-moz-range-thumb]:border-2
             [&::-moz-range-thumb]:border-dark-900">
  </div>

  <!-- Min/Max labels -->
  <div class="flex justify-between text-xs text-gray-500">
    <span>{{ formatValue(min) }}</span>
    <span>{{ formatValue(max) }}</span>
  </div>
</div>
